# Server-only runtime envs (NOT baked into image, set on VPS via --env-file):
#   BOT_MAKER, BOT_TAKER, BOT_PK, BOT_1INCH_KEY, BOT_LIVE, BOT_INTERVAL_MS,
#   BOT_MAX_TICKS_PER_DAY, BOT_TICK_BUDGET_USD, BOT_PORT, BOT_RPC_URL,
#   BOT_STRATEGIES, BOT_ROUTES
#   (full list with comments in taker-bot/.env.example)
# VPS run example:
#   docker run -p 3101:3101 --env-file taker-bot/.env ghcr.io/<owner>/aquara-taker-bot:latest
# Tag release: `git tag v1.2.3 && git push origin v1.2.3` produces `ghcr.io/<owner>/aquara-taker-bot:1.2.3`.

name: docker-taker-bot

on:
  push:
    tags: ["v*.*.*"]
    paths:
      - "taker-bot/**"
  workflow_dispatch:

concurrency:
  group: docker-taker-bot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aquara-taker-bot
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./taker-bot/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
