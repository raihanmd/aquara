# Required GitHub Secrets / Vars:
# - secrets.NEXT_PUBLIC_RPC_URL (required)  -> build-arg NEXT_PUBLIC_RPC_URL, e.g. https://lb.drpc.live/base/<key>
# - vars or build-args (defaults in workflow):
#     NEXT_PUBLIC_CHAIN_ID=8453
#     NEXT_PUBLIC_AGENT_ADDRESS=0x5235401AbA9b0f597A19B48497bf174a4dA8A090
#
# Server-only runtime envs (NOT baked into image, set on VPS via --env-file .env):
#   DATABASE_URL, ONEINCH_API_KEY, RELAYER_PRIVATE_KEY, CRE_API_KEY, AI_API_RPC, AI_API_KEY, AI_MODEL
# VPS run example:
#   docker run -p 3000:3000 --env-file .env ghcr.io/<owner>/aquara-web:latest
# Tag release: `git tag v1.2.3 && git push origin v1.2.3` produces `ghcr.io/<owner>/aquara-web:1.2.3`.

name: docker-web

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - "web/**"
  workflow_dispatch:

concurrency:
  group: docker-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aquara-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CHAIN_ID=8453
            NEXT_PUBLIC_AGENT_ADDRESS=0x5235401AbA9b0f597A19B48497bf174a4dA8A090
            NEXT_PUBLIC_RPC_URL=${{ secrets.NEXT_PUBLIC_RPC_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
